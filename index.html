<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Koreksi Lembar Jawab</title>
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Tesseract OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js" defer></script>
    
    <!-- PENGAMAN PRO: Menggunakan CDNJS Cloudflare (Paling stabil & anti-corrupt) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/opencv.js/4.8.0/opencv.min.js" defer></script>
</head>
<body>

    <div id="screen-settings" class="screen active">
        <h2>Pengaturan Bobot Nilai</h2>
        <div class="form-group">
            <label>PG Sederhana (Poin per 1 benar):</label>
            <input type="number" id="weight-pg" value="1" step="0.5">
        </div>
        <div class="form-group">
            <label>PG Kompleks (MCMA):</label>
            <div class="input-row">
                <input type="number" id="weight-mcma-1" placeholder="Jika 1 benar" value="1" step="0.5">
                <input type="number" id="weight-mcma-2" placeholder="Jika 2 benar" value="2" step="0.5">
                <input type="number" id="weight-mcma-3" placeholder="Jika 3 benar" value="3" step="0.5">
            </div>
        </div>
        <div class="form-group">
            <label>PG Kategori (Poin per 1 B/S benar):</label>
            <input type="number" id="weight-kategori" value="1" step="0.5">
        </div>
        <button id="btn-start-master" class="btn-primary">Simpan & Lanjut ke Kunci Jawaban</button>
    </div>

    <div id="screen-camera" class="screen hidden">
        <div class="top-bar">
            <span id="instruction-text">Arahkan ke lembar KUNCI JAWABAN</span>
            <button id="btn-end-session" class="btn-danger">Akhiri Sesi</button>
        </div>

        <div class="camera-container">
            <video id="video-feed" autoplay playsinline></video>
            <canvas id="canvas-overlay"></canvas>
            <div class="guideline"></div>
        </div>

        <div id="control-master" class="controls">
            <!-- Indikator Loading Dinamis -->
            <div id="loading-indicator" style="background: #ffc107; color: #333; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                Menyiapkan Sistem AI... (0%)
            </div>
            <button id="btn-lock-master" class="btn-primary" style="display: none;">Kunci Peta Jawaban</button>
        </div>

        <div id="popup-result" class="modal hidden">
            <div class="modal-content">
                <h2 id="result-nis">Nomor Siswa: Menganalisis...</h2>
                <h1 id="result-total">Skor Akhir: 0</h1>
                <p class="details" id="result-details">PG: 0 | Kompleks: 0 | Kategori: 0</p>
                <div class="modal-actions">
                    <button id="btn-next-scan" class="btn-success">Lanjut Scan</button>
                    <button id="btn-rescan" class="btn-warning">Pindai Ulang</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT PROGRESS BAR (METODE PENGECEKAN AKTIF) -->
    <script>
        window.cvIsLoaded = false;
        
        window.addEventListener('DOMContentLoaded', () => {
            const loadIndicator = document.getElementById('loading-indicator');
            const btnLockMaster = document.getElementById('btn-lock-master');
            let progress = 10;
            
            // Animasi angka persen palsu untuk menenangkan pengguna
            const animasiInterval = setInterval(() => {
                if (progress < 95) {
                    progress += 15;
                    if(loadIndicator) loadIndicator.innerText = `Menyiapkan Sistem AI... (${progress}%)`;
                }
            }, 300);

            // METODE POLING: Pengecekan paksa langsung ke otak AI
            const cekKesiapanInterval = setInterval(() => {
                // Mengecek apakah library cv dan modul cv.Mat (struktur inti AI) sudah tercipta
                if (typeof cv !== 'undefined' && typeof cv.Mat !== 'undefined') {
                    window.cvIsLoaded = true; // Tandai siap untuk vision.js
                    
                    clearInterval(animasiInterval);
                    clearInterval(cekKesiapanInterval);
                    
                    // Eksekusi UI seketika
                    if(loadIndicator) loadIndicator.style.display = 'none';
                    if(btnLockMaster) btnLockMaster.style.display = 'block';
                }
            }, 500); // Sistem mengecek setiap 0.5 detik
        });
    </script>

    <script src="camera.js" defer></script>
    <script src="vision.js" defer></script>
    <script src="ocr.js" defer></script>
    <script src="scoring.js" defer></script>
    <script src="app.js" defer></script>

</body>
</html>
